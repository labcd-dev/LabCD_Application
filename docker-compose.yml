services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labcd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labcd}
      POSTGRES_DB: ${POSTGRES_DB:-labcd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labcd} -d ${POSTGRES_DB:-labcd}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - RESULTS_DIR=/app/results
      - UPLOADS_DIR=/app/uploads
      - LABCD_ARTIFACTS_DIR=/app/artifacts
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-labcd}:${POSTGRES_PASSWORD:-labcd}@db:5432/${POSTGRES_DB:-labcd}
    volumes:
      - ./results:/app/results
      - ./uploads:/app/uploads
      - ./artifacts:/app/artifacts
      - ./.env:/app/.env
      - ./backend_api:/app/backend_api
      - ./backend_core:/app/backend_core
      - ./packages:/app/packages
    command: ["uvicorn", "backend_api.http.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - BACKEND_URL=http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
